    <!-- ⭐ 本地 API 改道：把 api.peilika.beer 的请求转发到本地 /chat -->
    <script>
        (function () {
            const origFetch = window.fetch;
            window.fetch = function (input, init) {
                try {
                    if (typeof input === 'string' && input.includes('api.peilika.beer')) {
                        console.log('[Local] 改道:', input, '-> /chat');
                        input = '/chat';
                    } else if (input && typeof input === 'object' && input.url && input.url.includes('api.peilika.beer')) {
                        input = new Request('/chat', input);
                    }
                } catch (e) { console.warn('[Local] fetch 拦截出错', e); }
                return origFetch.call(this, input, init);
            };
        })();
    </script>
